services:
  - type: web
    name: notes-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: backend/Dockerfile
    autoDeploy: true
    postDeployCommand: python manage.py migrate
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: your-service.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://your-service.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain
      - key: DATABASE_URL
        fromDatabase:
          name: notes-postgres
          property: connectionString
      - key: USE_S3
        value: "False"
      - key: REDIS_URL
        value: ""
      - key: DJANGO_LOG_LEVEL
        value: INFO

  - type: static
    name: notes-frontend
    plan: free
    env: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: frontend/build
    pullRequestPreviewsEnabled: false
    envVars:
      - key: REACT_APP_API_URL
        value: https://your-service.onrender.com/api
      - key: PUBLIC_URL
        value: /

# Provision Postgres; Render will inject DATABASE_URL
# You may want to upgrade from the free plan for production
# or adjust region/plan as needed.
databases:
  - name: notes-postgres
    plan: free
    databaseName: notes
