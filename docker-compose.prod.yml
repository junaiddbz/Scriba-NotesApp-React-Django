version: "3.9"

services:
  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: notes_app_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notes_network

  # Django Web Application
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notes_app_web
    command: |
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --worker-class gthread --access-logfile - --error-logfile - --log-level info
      "
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-securely}
      ALLOWED_HOSTS: "*"
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis}@redis:6379/1
      CACHE_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379/2
      FRONTEND_URL: ${FRONTEND_URL:-https://scriba-notes.duckdns.org}
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - notes_network
    restart: on-failure

  # Celery Worker for Async Tasks
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notes_app_celery_worker
    command: celery -A config worker -l info --concurrency=2
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-securely}
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis}@redis:6379/1
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    depends_on:
      - redis
      - web
    networks:
      - notes_network
    restart: on-failure

  # Celery Beat for Scheduled Tasks
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notes_app_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-securely}
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis}@redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - web
    networks:
      - notes_network
    restart: on-failure

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: notes_app_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    depends_on:
      - web
    networks:
      - notes_network
    restart: on-failure

volumes:
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  notes_network:
    driver: bridge
